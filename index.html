function isUnlocked(day, now = new Date()) {
  if (TESTMODUS) return true;
  const parts = new Intl.DateTimeFormat("de-DE", {
    timeZone: "Europe/Berlin", year: "numeric", month: "numeric", day: "numeric"
  }).formatToParts(now);
  const d = {};
  parts.forEach(p => { d[p.type] = Number(p.value); });

  if (d.year !== YEAR) return false;
  if (d.month !== 12) return false;
  return d.day >= day;
}

  {
    title: "Warum SPD?",

    heading: "Warum SPD?",
    body: "Die SPD ist eine Partei mit einer langen Geschichte. Entscheidend ist aber, wofür sie heute gebraucht wird: für ein Zusammenleben, in dem alle Menschen faire Chancen haben und niemand allein gelassen wird.\n\nDas zeigt sich in ganz konkreten Fragen: Können Familien von ihrem Einkommen leben? Finden junge Menschen eine gute Ausbildung? Gibt es bezahlbare Wohnungen und verlässliche Pflege? Haben Beschäftigte eine starke Stimme?\n\nSozialdemokratie bedeutet, solche Fragen nicht dem Zufall zu überlassen. Sie will Rahmenbedingungen schaffen, die Menschen stärken und ihnen ermöglichen, ihr Leben selbstbestimmt zu gestalten.\n\nDafür braucht es gute Ideen – und Menschen, die sich vor Ort dafür einsetzen.",

  {

    question: "Welche demokratische oder soziale Errungenschaft ist für dich unverzichtbar?"

  {

  {

    body: "Wenn der Nikolaus heute einen Blick auf die Politik werfen würde, hätte er vermutlich einen ziemlich vollen Sack: hinein kämen mehr Respekt, weniger leere Versprechen und eine gute Portion Zuhören.\n\nVielleicht würde er auch daran erinnern, dass Politik zuerst fragen sollte, was Menschen wirklich brauchen. Nicht jede Herausforderung lässt sich mit einem schnellen Spruch lösen. Gute Lösungen brauchen manchmal Geduld, klare Entscheidungen und den Mut, unterschiedliche Interessen zusammenzubringen.\n\nUnd weil Nikolaus ist, darf ein Wunsch natürlich sein: mehr Fairness im Alltag und weniger Gegeneinander.",

  },

    title: "Arbeit muss sich lohnen",
    file: "Arbeit muss sich lohnen.png",
    heading: "Arbeit muss sich lohnen",
    body: "Arbeit muss sich lohnen. Wer jeden Tag arbeitet, sollte von seinem Lohn leben können. Das klingt selbstverständlich, ist es aber längst nicht für alle.\n\nFaire Arbeit bedeutet mehr als einen angemessenen Lohn. Dazu gehören sichere Arbeitsplätze, verlässliche Arbeitszeiten, gute Bedingungen und Respekt. Auch Mitbestimmung spielt eine wichtige Rolle: Beschäftigte müssen eine Stimme haben, wenn es um ihre Arbeitsbedingungen geht.\n\nEine starke Wirtschaft braucht gute Arbeit – und Menschen, die von ihrer Arbeit gut leben können. Dafür braucht es klare Regeln und eine Politik, die Beschäftigte nicht aus dem Blick verliert.",

    title: "Bildung für alle",
    file: "Bildung für alle_ Adventskalender-Türchen 8.png",
    heading: "Bildung für alle",

    body: "Gleichberechtigung steht im Gesetz, aber im Alltag ist sie noch lange nicht überall angekommen. Frauen verdienen in vielen Bereichen weniger, übernehmen einen großen Teil der unbezahlten Sorgearbeit und werden in Beruf und Politik immer noch zu oft übersehen.\n\nGleichstellung bedeutet, dass alle Menschen die gleichen Möglichkeiten haben und niemand wegen des Geschlechts benachteiligt wird. Dafür braucht es nicht nur gute Gesetze, sondern auch Strukturen, die Gleichberechtigung im Alltag möglich machen.\n\nEine Gesellschaft, in der Frauen gleichberechtigt leben und entscheiden können, ist eine gerechtere Gesellschaft für alle.",

    body: "Kommunalpolitik klingt für manche erst einmal ziemlich trocken. Dabei geht es um Dinge, die wir jeden Tag sehen und nutzen: Straßen, Schulen, Kinderbetreuung, Feuerwehr, Baugebiete, öffentliche Räume und vieles mehr.\n\nIm Gemeinderat werden Entscheidungen getroffen, die das Leben vor Ort ganz konkret beeinflussen. Es geht um Prioritäten, um knappe Mittel und darum, gute Lösungen für möglichst viele Menschen zu finden.\n\nGerade auf kommunaler Ebene kann man Politik direkt erleben. Man kennt die Orte, die Menschen und oft auch die Probleme. Deshalb lohnt es sich, hinzuschauen, Fragen zu stellen und sich einzubringen.",
    question: "Was sollte sich in deiner Gemeinde dringend ändern?"
  },

    title: "Wohnen darf kein Luxus sein",
    file: "Wohnen darf kein Luxus sein.png",

    body: "Eine Wohnung ist kein Luxusartikel. Sie ist der Ort, an dem wir leben, schlafen, unsere Kinder großziehen und zur Ruhe kommen. Wenn die Miete einen immer größeren Teil des Einkommens verschlingt, bleibt für vieles andere kaum noch Platz.\n\nBezahlbares Wohnen ist deshalb eine soziale Frage. Menschen brauchen ein Zuhause, das sie sich leisten können – unabhängig davon, ob sie allein leben, eine Familie haben oder im Alter eine kleinere Wohnung suchen.\n\nDafür braucht es mehr bezahlbaren Wohnraum, eine vorausschauende kommunale Planung und eine Wohnungspolitik, die nicht nur den Markt betrachtet, sondern die Menschen.",

// ---------- Bilder ----------
const UMLAUT_DE = { "ä": "ae", "ö": "oe", "ü": "ue", "Ä": "Ae", "Ö": "Oe", "Ü": "Ue", "ß": "ss" };
const UMLAUT_PLAIN = { "ä": "a", "ö": "o", "ü": "u", "Ä": "A", "Ö": "O", "Ü": "U", "ß": "ss" };

function imageUrls(file) {
  const wpName = map => file.replace(/[äöüÄÖÜß]/g, c => map[c]).replace(/[\s-]+/g, "-");
  const names = [wpName(UMLAUT_DE), wpName(UMLAUT_PLAIN), file];
  return [...new Set(names)].map(name => IMG_BASE + encodeURIComponent(name));
}

function loadImage(img, file, onFail) {
  const urls = imageUrls(file);
  let index = 0;
  img.onerror = () => {
    index += 1;
    if (index >= urls.length) { onFail(); return; }
    img.src = urls[index];
  };
  img.src = urls[0];
}

// ---------- Hilfsfunktionen ----------
const STORAGE_KEY = "spd-adventskalender-" + YEAR + "-opened" + (TESTMODUS ? "-test" : "");
const calendar = document.getElementById("spdadv-calendar");
const dialog = document.getElementById("spdadv-dialog");
const dialogTitle = document.getElementById("spdadv-title");
const imgBox = document.getElementById("spdadv-imgbox");
const imageMissing = document.getElementById("spdadv-missing");
const storyHeading = document.getElementById("spdadv-heading");
const storyCopy = document.getElementById("spdadv-copy");
const storyQuestion = document.getElementById("spdadv-question");
let lastDay = 0;

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function loadOpened() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    if (!Array.isArray(raw)) return new Set();
    return new Set(raw.filter(n => Number.isInteger(n) && n >= 1 && n <= stories.length));
  } catch (_) {
    return new Set();
  }
}

let opened = loadOpened();

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...opened])); } catch (_) {}
}

function render() {
  calendar.replaceChildren();
  stories.forEach((story, index) => {
    const day = index + 1;
    const locked = !isUnlocked(day);
    const isOpen = !locked && opened.has(day);

    const button = el("button", "door" + (isOpen ? " opened" : ""));
    button.type = "button";
    button.disabled = locked;
    button.setAttribute("aria-label", locked
      ? "Türchen " + day + ", öffnet am " + day + ". Dezember"
      : "Türchen " + day + ": " + story.title);

    if (isOpen) {
      const preview = el("img", "door-preview");
      preview.alt = "";
      preview.loading = "lazy";
      loadImage(preview, story.file, () => preview.remove());
      button.appendChild(preview);
    }

    const top = el("span", "door-top");
    top.append(el("span", "", "SPD"), el("span", "", "Advent"));
    const number = el("span", "door-number", String(day).padStart(2, "0"));
    const label = el("span", "door-label",
      locked ? "Ab " + day + ". Dezember" : (isOpen ? story.title : "Türchen öffnen"));
    button.append(top, number, label);

    if (!locked) button.addEventListener("click", () => openDoor(day));
    calendar.appendChild(button);
  });
}

function openDoor(day) {
  if (!isUnlocked(day)) return;
  const story = stories[day - 1];
  lastDay = day;
  opened.add(day);
  save();
  render();

  dialogTitle.textContent = "Türchen " + day + ": " + story.title;
  storyHeading.textContent = story.heading;
  storyCopy.textContent = story.body;
  storyQuestion.textContent = story.question;

  imgBox.replaceChildren();
  imageMissing.style.display = "none";
  const img = el("img");
  img.alt = "SPD-Adventskalender, Türchen " + day + ": " + story.title;
  imgBox.appendChild(img);
  loadImage(img, story.file, () => {
    img.remove();
    imageMissing.style.display = "block";
  });

  if (dialog.open) return;
  if (typeof dialog.showModal === "function") dialog.showModal();
  else dialog.setAttribute("open", "");
}

document.getElementById("spdadv-close").addEventListener("click", () => dialog.close());
dialog.addEventListener("click", event => { if (event.target === dialog) dialog.close(); });
dialog.addEventListener("close", () => {
  const door = calendar.children[lastDay - 1];
  if (door) door.focus();
});

document.getElementById("spdadv-reset").addEventListener("click", () => {
  if (!window.confirm("Möchtest du den gespeicherten Öffnungsstand wirklich zurücksetzen?")) return;
  opened.clear();
  save();
  render();
});

render();

})();
</script>
